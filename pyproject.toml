[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser"
version = "0.1.0"
description = "Evidence-bound PDF parser for packaging label standard documents."
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.4.0",
  "pdfplumber>=0.11.8",
  "pypdfium2>=5.2.0",
  "openpyxl>=3.1.5",
  "requests>=2.31.0",
  "cos-python-sdk-v5>=1.9.30",
  "zai-sdk>=0.2.3",
  "socksio>=1.0.0",
]

[project.scripts]
parse-pdf = "document_parser.cli:main"
extract-structure = "document_parser.runner:main"
run-agent-harness = "document_parser.harness:main"
run-pdf-regression = "document_parser.pdf_regression:main"
compare-package-image = "document_parser.image_compare_cli:main"
check-package-consistency = "document_parser.consistency_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_parser = ["resources/*.json", "schemas/*.json"]
